<svg width="610" height="300" viewBox="0 0 610 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TripStar project card</title>
  <desc id="desc">A featured project card for TripStar, a multi-agent travel planning system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="610" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e6f4f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="590" height="280" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10.5" y="10.5" width="589" height="279" rx="17.5" stroke="#0f766e" stroke-opacity="0.16"/>
  <rect x="34" y="36" width="76" height="30" rx="15" fill="#0f766e"/>
  <text x="52" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Pinned</text>

  <text x="34" y="104" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">TripStar</text>
  <text x="34" y="137" fill="#0f766e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">多智能体协作旅行规划系统</text>

  <text x="34" y="176" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">基于 HelloAgents 的 Multi-Agent 文旅规划系统，融合</text>
  <text x="34" y="201" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">LLM、ReAct、小红书、地图 MCP 与知识图谱能力，</text>
  <text x="34" y="226" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">自动生成路线、预算、预约提醒与个性化旅行攻略。</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">
    <rect x="34" y="246" width="98" height="28" rx="14" fill="#f5eadc"/>
    <text x="50" y="265" fill="#92400e">Stars 2.2k+</text>
    <rect x="142" y="246" width="86" height="28" rx="14" fill="#e0f2fe"/>
    <text x="158" y="265" fill="#075985">Forks 255</text>
  </g>

  <g transform="translate(398 50)">
    <rect x="0" y="0" width="164" height="72" rx="18" fill="#ffffff" fill-opacity="0.72"/>
    <image href="./Tripstar.png" x="14" y="15" width="136" height="42" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
