<svg width="610" height="300" viewBox="0 0 610 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">lunwentocode project card</title>
  <desc id="desc">A featured project card for lunwentocode, a paper-to-code generation system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="610" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5eadc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="590" height="280" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10.5" y="10.5" width="589" height="279" rx="17.5" stroke="#b45309" stroke-opacity="0.18"/>
  <rect x="34" y="36" width="84" height="30" rx="15" fill="#b45309"/>
  <text x="52" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Research</text>

  <text x="34" y="104" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">lunwentocode</text>
  <text x="34" y="137" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">论文代码自动生成系统</text>

  <text x="34" y="176" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">将论文 Markdown 内容转化为可运行 Python 项目，</text>
  <text x="34" y="201" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">使用双 LLM 驱动工作流完成逻辑理解、任务拆解、</text>
  <text x="34" y="226" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">代码生成、AST 语法校验与自动修复闭环。</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">
    <rect x="34" y="246" width="84" height="28" rx="14" fill="#f5eadc"/>
    <text x="50" y="265" fill="#92400e">Stars 181</text>
    <rect x="128" y="246" width="72" height="28" rx="14" fill="#e0f2fe"/>
    <text x="144" y="265" fill="#075985">Forks 7</text>
  </g>

  <g transform="translate(470 58)">
    <rect x="0" y="0" width="82" height="82" rx="22" fill="#ffffff" fill-opacity="0.72"/>
    <path d="M14 31L41 19L68 31L41 43L14 31Z" fill="#2d214c"/>
    <path d="M25 39V50C32 57 50 57 57 50V39L41 46L25 39Z" fill="#4b3a78"/>
    <path d="M68 31V47" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="51" r="4" fill="#f59e0b"/>
    <path d="M30 43C36 47 46 48 54 43" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
