<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Liu Chaochao profile banner</title>
  <desc id="desc">A clean technical blog style banner for an AI application engineer.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef6f4"/>
      <stop offset="1" stop-color="#f7f3ea"/>
    </linearGradient>
    <linearGradient id="ink" x1="122" y1="101" x2="1005" y2="313" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#0f172a" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#paper)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <g opacity="0.8">
    <circle cx="1138" cy="92" r="148" fill="#0f766e" fill-opacity="0.08"/>
    <circle cx="104" cy="354" r="180" fill="#b45309" fill-opacity="0.07"/>
  </g>

  <g transform="translate(88 74)">
    <rect x="0" y="0" width="1104" height="272" rx="28" fill="white" fill-opacity="0.74" filter="url(#shadow)"/>
    <rect x="0.5" y="0.5" width="1103" height="271" rx="27.5" stroke="#0f172a" stroke-opacity="0.08"/>

    <g transform="translate(54 46)">
      <text x="0" y="28" fill="#0f766e" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">AI Application Engineer</text>
      <text x="0" y="88" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">LLM Agents · Harness · AI Systems</text>
      <text x="0" y="132" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Building practical AI workflows from research prototypes to production.</text>

    </g>

    <g transform="translate(930 62)">
      <rect x="0" y="0" width="132" height="132" rx="20" fill="#0f172a"/>
      <path d="M28 89C44 67 64 57 86 57C96 57 105 59 114 63" stroke="#99f6e4" stroke-width="8" stroke-linecap="round"/>
      <path d="M26 45C44 65 62 75 79 75C94 75 105 68 114 54" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
      <circle cx="48" cy="48" r="9" fill="#99f6e4"/>
      <circle cx="91" cy="86" r="9" fill="#fbbf24"/>
      <circle cx="107" cy="44" r="7" fill="#ffffff"/>
    </g>
  </g>
</svg>
